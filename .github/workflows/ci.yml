name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install typst (not in Ubuntu repos)
        run: |
          set -e
          # typst is not packaged in Ubuntu LTS; use the official statically-linked
          # musl binary from GitHub releases.
          TYPST_TARBALL="typst-x86_64-unknown-linux-musl.tar.xz"
          wget -q "https://github.com/typst/typst/releases/latest/download/${TYPST_TARBALL}"
          tar -xf "${TYPST_TARBALL}"
          sudo install -m 0755 typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          rm -rf "${TYPST_TARBALL}" typst-x86_64-unknown-linux-musl
          typst --version

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: make lint

      - name: Test
        run: make test

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deb build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper dh-python python3-all \
            python3-setuptools python3-build python3-installer python3-pip

      - name: Build .deb
        run: make deb

      - name: Verify .deb
        run: |
          set -e
          # dpkg-buildpackage writes the .deb to the parent of the source dir
          ls -la ../*.deb
          DEB="$(ls ../yttranscript_*.deb | head -n1)"
          echo "Built: $DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | head -n 20
          # Extract and verify the entry point was wired by pybuild
          rm -rf /tmp/yttranscript-extract
          dpkg-deb -x "$DEB" /tmp/yttranscript-extract
          test -x /tmp/yttranscript-extract/usr/bin/yttranscript
          echo "Entry point /usr/bin/yttranscript present"

      - name: Stage .deb into workspace
        run: |
          mkdir -p build-artifacts
          cp ../yttranscript_*.deb build-artifacts/
          ls -la build-artifacts/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: yttranscript-deb
          path: build-artifacts/*.deb
