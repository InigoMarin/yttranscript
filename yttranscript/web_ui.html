<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yttranscript</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22 fill=%22%237c3aed%22>%E2%98%85</text></svg>">
<style>
  :root { --bg: #0f0f0f; --surface: #1a1a2e; --accent: #7c3aed; --text: #e2e8f0; --muted: #94a3b8; --ok: #22c55e; --err: #ef4444; --border: #334155; --input-bg: #0f0f0f; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f1f5f9; --surface: #ffffff; --text: #1e293b; --muted: #64748b; --border: #cbd5e1; --input-bg: #ffffff; }
  }
  html.light { --bg: #f1f5f9; --surface: #ffffff; --text: #1e293b; --muted: #64748b; --border: #cbd5e1; --input-bg: #ffffff; }
  html.dark { --bg: #0f0f0f; --surface: #1a1a2e; --text: #e2e8f0; --muted: #94a3b8; --border: #334155; --input-bg: #0f0f0f; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 2rem; }
  .container { max-width: 800px; width: 100%; }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--accent); display: flex; align-items: center; justify-content: space-between; }
  .card { background: var(--surface); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  input[type="text"] { width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 1rem; }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; align-items: center; }
  select, input[type="checkbox"] { accent-color: var(--accent); }
  select { padding: 0.5rem; border-radius: 6px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); }
  .lang-input { width: 5rem; padding: 0.35rem 0.5rem; border-radius: 6px; background: var(--input-bg); color: var(--text); border: 1px solid var(--border); font-size: 0.875rem; }
  label { font-size: 0.875rem; color: var(--muted); display: flex; align-items: center; gap: 0.25rem; }
  button { padding: 0.75rem 2rem; border-radius: 8px; border: none; background: var(--accent); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #status { margin-top: 1rem; font-size: 0.875rem; color: var(--muted); }
  #result { font-size: 0.875rem; line-height: 1.6; max-height: 60vh; overflow-y: auto; padding: 0.25rem; }
  #result.plain { white-space: pre-wrap; font-family: monospace; }
  #result.md { font-family: system-ui, sans-serif; }
  #result.md h1 { font-size: 1.3rem; margin: 0 0 0.75rem; color: var(--accent); }
  #result.md h2 { font-size: 1.15rem; margin: 0.75rem 0 0.4rem; }
  #result.md h3 { font-size: 1rem; margin: 0.6rem 0 0.35rem; color: var(--text); }
  #result.md p { margin: 0.35rem 0; }
  #result.md strong { font-weight: 700; }
  #result.md hr { border: none; border-top: 1px solid var(--border); margin: 0.75rem 0; }
  #result.md ul { margin: 0.35rem 0 0.35rem 1.5rem; }
  #result.md li { margin: 0.15rem 0; }
  .error { color: var(--err); }
  .ok { color: var(--ok); }
  input[type="text"].invalid { border-color: var(--err); }
  .hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; }
  .hint.warn { color: #fbbf24; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.secondary:hover { border-color: var(--accent); }
  .meta-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0 0.75rem; font-size: 0.75rem; align-items: flex-start; }
  .meta-chip { background: var(--input-bg); padding: 0.2rem 0.6rem; border-radius: 4px; border: 1px solid var(--border); }
  .meta-chip b { color: var(--muted); font-weight: 600; margin-right: 0.3em; }
  .meta-chip a { color: var(--accent); text-decoration: underline; word-break: break-all; }
  .video-card { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem; }
  .video-card-thumb { line-height: 0; }
  .video-card-thumb img { width: 100%; aspect-ratio: 16/9; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
  .video-card-thumb img:hover { opacity: 0.9; }
  .video-card-info { }
  .video-card-info h1 { font-size: 1.1rem; margin: 0 0 0.25rem; color: var(--accent); }
  .video-card-stats { font-size: 0.8rem; color: var(--muted); display: flex; gap: 0.75rem; flex-wrap: wrap; }
  #output-card .stats { margin: 0.5rem 0; }
  #status a { color: var(--ok); text-decoration: underline; }
  #status a:hover { opacity: 0.8; }
  .stats { display: none; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; font-size: 0.7rem; color: var(--muted); }
  .stats span { background: var(--input-bg); padding: 0.15rem 0.5rem; border-radius: 4px; border: 1px solid var(--border); }
  #result.md em { font-style: italic; }
  #result.md code { font-family: monospace; background: var(--input-bg); padding: 0.1em 0.35em; border-radius: 3px; font-size: 0.9em; border: 1px solid var(--border); }
  #log { max-height: 180px; overflow-y: auto; margin-top: 0.75rem; font-size: 0.8rem; font-family: monospace; display: none; }
  .log-info { color: var(--muted); }
  .log-success { color: var(--ok); }
  .log-warn { color: #fbbf24; }
  .log-error { color: var(--err); }
  #output-header { display: none; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); gap: 0.75rem; }
  #output-title { font-size: 1rem; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #output-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  #output-actions button { padding: 0.4rem 1rem; font-size: 0.8rem; }
  button.cancel { background: var(--err); }
  .theme-btn { background: none; border: 1px solid var(--border); color: var(--muted); padding: 0.3rem 0.6rem; font-size: 1.1rem; line-height: 1; border-radius: 6px; cursor: pointer; transition: color 0.2s, border-color 0.2s; width: auto; }
  .theme-btn:hover { color: var(--text); border-color: var(--accent); }
  .theme-btn.enabled { color: var(--ok); border-color: var(--ok); }
  .theme-btn.muted { opacity: 0.5; }
  .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media print {
    body { background: #fff !important; color: #000 !important; padding: 0 !important; }
    .card { box-shadow: none; border: 1px solid #ccc; page-break-inside: avoid; }
    #theme-toggle, #log, #output-header, #log-toggle, #running-hint, #summarize-hint, .stats, .meta-row, .video-card, button { display: none !important; }
    #result { max-height: none !important; overflow: visible !important; }
    a { color: #000 !important; text-decoration: underline; }
  }
  @media (max-width: 600px) {
    body { padding: 1rem; }
    .row { flex-direction: column; align-items: stretch; }
    .row label { width: 100%; }
    .lang-input { width: 100%; }
    select { width: 100%; }
    button:not(.theme-btn):not(.secondary) { width: 100%; }
    #output-header { flex-wrap: wrap; }
    #output-title { max-width: 100%; }
    #output-actions { width: 100%; }
    #output-actions button { flex: 1; }
    .video-card-thumb img { width: 100%; }
    .card { padding: 1rem; }
    h1 { font-size: 1.25rem; }
  }
</style>
</head>
<body>
<noscript>
  <div class="container">
    <div class="card">
      <p>This UI requires JavaScript. Use the CLI instead: <code>yttranscript &lt;URL&gt;</code></p>
    </div>
  </div>
</noscript>
<div class="container">
  <h1>&#9733; yttranscript <span style="display:flex;gap:0.4rem;"><button id="theme-toggle" class="theme-btn" title="Toggle theme">&#9788;</button><button id="notify-toggle" class="theme-btn" title="Enable notifications" style="display:none;">&#128276;</button></span></h1>
  <div class="card">
    <input type="text" id="url" placeholder="Paste YouTube URL..." />
    <div class="row">
      <label>Lang <input type="text" id="lang" list="lang-codes" placeholder="Auto" class="lang-input"><datalist id="lang-codes"><option value="en"><option value="es"><option value="fr"><option value="de"><option value="pt"><option value="it"><option value="ja"><option value="zh"><option value="ko"><option value="ar"><option value="ru"><option value="nl"><option value="pl"><option value="tr"></datalist></label>
      <label>Format <select id="format"><option value="txt">txt</option><option value="json">json</option><option value="vtt">vtt</option><option value="srt">srt</option><option value="pdf">pdf</option><option value="epub">epub</option><option value="docx">docx</option></select></label>
      <label><input type="checkbox" id="timestamps"> Timestamps</label>
      <label><input type="checkbox" id="summarize"> Summarize</label>
      <input type="text" id="filename" placeholder="Save as (auto)" class="lang-input" style="width:9rem;" aria-label="Save as filename">
    </div>
    <div class="row">
      <button id="btn" onclick="run()">Transcribe</button>
    </div>
    <div id="summarize-hint" class="hint warn" style="display:none;">Requires <code>summarize_cmd</code> to be set in config to actually summarize.</div>
    <div id="lang-badge" class="hint" style="display:none;">🌐 Language: <span id="lang-badge-text"></span></div>
    <div id="running-hint" class="hint" style="display:none;">⏳ Still working — Whisper can take several minutes for long videos.</div>
    <div id="status"></div>
    <button id="log-toggle" class="theme-btn" style="display:none;" onclick="toggleLog()">▼ Logs</button>
    <div id="log"></div>
  </div>
  <div class="card" id="output-card" style="display:none;">
    <div id="output-header">
      <span id="output-title"></span>
      <div id="output-actions">
        <button onclick="copyText()" id="copy-btn">Copy</button>
        <button onclick="downloadFile()" id="dl-btn">Download</button>
      </div>
    </div>
    <div id="result"></div>
  </div>
</div>
<script>
let lastResult = null;
let currentController = null;
function safeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function safeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
}
function setTheme(theme) {
  document.documentElement.classList.toggle('light', theme === 'light');
  document.documentElement.classList.toggle('dark', theme === 'dark');
  safeSet('theme', theme);
  updateThemeIcon();
}
function currentTheme() {
  return document.documentElement.classList.contains('light') ? 'light' : 'dark';
}
function updateThemeIcon() {
  const btn = document.getElementById('theme-toggle');
  if (btn) btn.textContent = currentTheme() === 'light' ? '🌙' : '☀';
}
(function initTheme() {
  const saved = safeGet('theme');
  if (saved) {
    setTheme(saved);
  } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
    setTheme('light');
  }
  updateThemeIcon();
  document.getElementById('theme-toggle').addEventListener('click', function() {
    setTheme(currentTheme() === 'light' ? 'dark' : 'light');
  });
})();
(function initNotify() {
  const btn = document.getElementById('notify-toggle');
  if (!("Notification" in window)) return;
  btn.style.display = 'inline-block';
  function refresh() {
    const p = Notification.permission;
    btn.textContent = p === 'granted' ? '\u{1F514}' : p === 'denied' ? '\u{1F507}' : '\u{1F514}';
    btn.title = p === 'granted' ? 'Notifications enabled'
              : p === 'denied'  ? 'Notifications blocked (enable in browser settings)'
              : 'Enable notifications';
    btn.classList.toggle('enabled', p === 'granted');
    btn.classList.toggle('muted', p === 'denied');
  }
  btn.addEventListener('click', function() {
    if (Notification.permission === 'default') {
      Notification.requestPermission().then(refresh);
    } else {
      refresh();
    }
  });
  refresh();
})();
const FORM_KEY = 'form-state';
function saveForm() {
  safeSet(FORM_KEY, JSON.stringify({
    url: document.getElementById('url').value,
    lang: document.getElementById('lang').value,
    format: document.getElementById('format').value,
    timestamps: document.getElementById('timestamps').checked,
    summarize: document.getElementById('summarize').checked,
  }));
}
function restoreForm() {
  const raw = safeGet(FORM_KEY);
  if (!raw) return;
  try {
    const s = JSON.parse(raw);
    if (typeof s.url === 'string') document.getElementById('url').value = s.url;
    if (typeof s.lang === 'string') document.getElementById('lang').value = s.lang;
    if (typeof s.format === 'string') document.getElementById('format').value = s.format;
    if (typeof s.timestamps === 'boolean') document.getElementById('timestamps').checked = s.timestamps;
    if (typeof s.summarize === 'boolean') document.getElementById('summarize').checked = s.summarize;
  } catch (e) {}
}
function initFormPersistence() {
  restoreForm();
  document.getElementById('url').addEventListener('input', saveForm);
  document.getElementById('lang').addEventListener('input', saveForm);
  document.getElementById('format').addEventListener('change', saveForm);
  document.getElementById('timestamps').addEventListener('change', saveForm);
  document.getElementById('summarize').addEventListener('change', saveForm);
}
initFormPersistence();
const YOUTUBE_URL_RE = /^https?:\/\/(?:[a-z0-9-]+\.)*(?:youtube\.com|youtu\.be|youtube-nocookie\.com)\//i;
function validateUrl() {
  const el = document.getElementById('url');
  const v = el.value.trim();
  el.classList.toggle('invalid', v !== '' && !YOUTUBE_URL_RE.test(v));
}
document.getElementById('url').addEventListener('blur', validateUrl);
document.getElementById('url').addEventListener('input', validateUrl);
function updateSummarizeHint() {
  document.getElementById('summarize-hint').style.display =
    document.getElementById('summarize').checked ? 'block' : 'none';
}
document.getElementById('summarize').addEventListener('change', updateSummarizeHint);
updateSummarizeHint();
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function inlineMd(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function renderMarkdown(text) {
  const t = escapeHtml(text);
  const blocks = t.split(/\n\n+/);
  const html = [];
  for (const block of blocks) {
    const lines = block.split('\n');
    const first = lines[0].trim();
    if (first === '---') { html.push('<hr>'); continue; }
    const hm = first.match(/^(#{1,3})\s+(.+)$/);
    if (hm) { html.push('<h' + hm[1].length + '>' + inlineMd(hm[2]) + '</h' + hm[1].length + '>'); continue; }
    if (first.match(/^[-*]\s/)) {
      const items = lines.filter(l => l.trim().match(/^[-*]\s/)).map(l =>
        '<li>' + inlineMd(l.trim().replace(/^[-*]\s/, '')) + '</li>');
      html.push('<ul>' + items.join('') + '</ul>');
      continue;
    }
    const metaRe = /^\*\*([A-Z][A-Za-z]*):\*\*\s*(.+?)\s*$/;
    const nonEmpty = lines.filter(l => l.trim());
    const metaMatches = nonEmpty.map(l => l.match(metaRe)).filter(Boolean);
    if (metaMatches.length === nonEmpty.length && metaMatches.length > 0) {
      let thumbHtml = '';
      for (const m of metaMatches) {
        if (m[1] === 'URL') {
          const vid = m[2].match(/(?:watch\?v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
          if (vid) {
            thumbHtml = '<a href="' + m[2] + '" target="_blank" rel="noopener noreferrer">' +
              '<img src="https://i.ytimg.com/vi/' + vid[1] + '/mqdefault.jpg" alt="Video thumbnail" onerror="this.parentElement.style.display=\'none\'">' +
              '</a>';
          }
          break;
        }
      }
      let titleHtml = '';
      if (html.length > 0 && /^<h[1-3]>/.test(html[html.length - 1])) {
        titleHtml = html.pop();
      }
      const chips = metaMatches.filter(m => m[1] !== 'URL' && m[1] !== 'Duration' && m[1] !== 'Transcribed').map(m => {
        const label = m[1];
        let val = m[2];
        if (/^https?:\/\//.test(val)) {
          val = '<a href="' + val + '" target="_blank" rel="noopener noreferrer">' + val + '</a>';
        }
        return '<span class="meta-chip"><b>' + label + ':</b> ' + val + '</span>';
      });
      if (thumbHtml) {
        html.push('<div class="video-card">' +
          '<div class="video-card-thumb">' + thumbHtml + '</div>' +
          '<div class="video-card-info">' + titleHtml +
          '<div id="video-card-stats" class="video-card-stats"></div>' +
          '<div class="meta-row">' + chips.join('') + '</div></div></div>');
      } else {
        if (titleHtml) html.push(titleHtml);
        html.push('<div class="meta-row">' + chips.join('') + '</div>');
      }
      continue;
    }
    const joined = lines.map(l => l.endsWith('  ') ? l.slice(0,-2) + '<br>' : l).join(' ');
    html.push('<p>' + inlineMd(joined) + '</p>');
  }
  return html.join('\n');
}
function addLog(message, type) {
  const log = document.getElementById('log');
  log.style.display = 'block';
  document.getElementById('log-toggle').style.display = 'inline-block';
  const div = document.createElement('div');
  div.className = 'log-' + type;
  div.textContent = message;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function toggleLog() {
  const log = document.getElementById('log');
  const btn = document.getElementById('log-toggle');
  const hidden = log.style.display === 'none';
  log.style.display = hidden ? 'block' : 'none';
  btn.textContent = hidden ? '▼ Logs' : '▶ Logs';
}
function showStats(text) {
  const vcStats = document.getElementById('video-card-stats');
  if (!vcStats) return;
  if (!text) { vcStats.style.display = 'none'; vcStats.innerHTML = ''; return; }
  const words = text.trim() ? text.trim().split(/\s+/).filter(Boolean).length : 0;
  const minutes = Math.max(1, Math.round(words / 200));
  const durMatch = text.match(/\*\*Duration:\*\*\s*(.+)/);
  const dur = durMatch ? durMatch[1].trim() : '';
  const parts = [];
  if (dur) parts.push('<span>\u23F1\uFE0F ' + dur + '</span>');
  parts.push('<span>\uD83D\uDCDD ' + words.toLocaleString() + ' words</span>');
  parts.push('<span>\uD83D\uDCD6 ' + minutes + ' min read</span>');
  vcStats.innerHTML = parts.join('');
  vcStats.style.display = 'flex';
}
let hintTimer = null;
function startHintTimer() {
  clearTimeout(hintTimer);
  document.getElementById('running-hint').style.display = 'none';
  hintTimer = setTimeout(() => {
    if (currentController) {
      document.getElementById('running-hint').style.display = 'block';
    }
  }, 15000);
}
function clearHint() {
  clearTimeout(hintTimer);
  hintTimer = null;
  document.getElementById('running-hint').style.display = 'none';
}
window.addEventListener('beforeunload', e => {
  if (currentController) {
    e.preventDefault();
    e.returnValue = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && currentController) {
    e.preventDefault();
    currentController.abort();
  } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    run();
  }
});
function setStatus(text, cls) {
  const status = document.getElementById('status');
  status.textContent = '';
  const span = document.createElement('span');
  if (cls) span.className = cls;
  span.textContent = text;
  status.appendChild(span);
}
let _origTitle = document.title;
let _titleTimer = null;
function flashTabTitle(title) {
  if (document.hasFocus()) return;
  clearTimeout(_titleTimer);
  _origTitle = document.title;
  document.title = '(\u2713) ' + (title || 'Transcripci\u00f3n lista');
  const restore = () => {
    document.title = _origTitle;
    window.removeEventListener('focus', restore);
    clearTimeout(_titleTimer);
  };
  window.addEventListener('focus', restore);
  _titleTimer = setTimeout(restore, 15000);
}
function notifyDone(title, videoUrl) {
  flashTabTitle(title);
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  let icon = "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%228%22 y=%2213%22 font-size=%2214%22 text-anchor=%22middle%22 fill=%22%237c3aed%22>%E2%98%85</text></svg>";
  if (videoUrl) {
    const vid = videoUrl.match(/(?:watch\?v=|youtu\.be\/|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
    if (vid) icon = "https://i.ytimg.com/vi/" + vid[1] + "/hqdefault.jpg";
  }
  const n = new Notification("\u2713 Transcripci\u00f3n lista", {
    body: title || "yttranscript",
    icon: icon
  });
  n.onclick = () => { window.focus(); n.close(); };
}
async function run() {
  const btn = document.getElementById('btn');
  if (currentController) {
    currentController.abort();
    return;
  }
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const status = document.getElementById('status');
  const result = document.getElementById('result');
  const outputCard = document.getElementById('output-card');
  const outputHeader = document.getElementById('output-header');
  const log = document.getElementById('log');
  const fmt = document.getElementById('format').value;
  const summarize = document.getElementById('summarize').checked;
  log.innerHTML = '';
  log.style.display = 'none';
  const logBtn = document.getElementById('log-toggle');
  logBtn.style.display = 'none';
  logBtn.textContent = '▼ Logs';
  showStats('');
  document.getElementById('lang-badge').style.display = 'none';
  result.textContent = '';
  outputCard.style.display = 'none';
  outputHeader.style.display = 'none';
  status.innerHTML = '<span class="spinner"></span> Processing...';
  btn.textContent = 'Cancel';
  btn.className = 'cancel';
  const requestedLang = document.getElementById('lang').value.trim();
  const params = new URLSearchParams({ url });
  if (requestedLang) params.set('lang', requestedLang);
  params.set('format', fmt);
  if (document.getElementById('timestamps').checked) params.set('timestamps', '1');
  if (summarize) params.set('summarize', '1');
  const controller = new AbortController();
  currentController = controller;
  startHintTimer();
  try {
    const res = await fetch('/api?' + params, { signal: controller.signal });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(raw.slice(6)); }
        catch (e) { addLog('Malformed event from server', 'warn'); continue; }
        if (!data || typeof data.type !== 'string') continue;
        if (data.type === 'done') {
          status.innerHTML = '<span class="ok">✓ Done</span>';
          outputCard.style.display = 'block';
          outputHeader.style.display = 'flex';
          document.getElementById('output-title').textContent = data.title || 'transcript';
          lastResult = { text: data.text || '', filename: data.filename || 'transcript.txt', url: url };
          if (data.download) {
            result.className = 'md';
            const customFn = document.getElementById('filename').value.trim();
            const dlFn = customFn || data.filename;
            result.innerHTML = '<p style="margin:1rem 0"><a href="' + escapeHtml(data.download) + '" download="' + escapeHtml(dlFn) + '" style="display:inline-block;padding:0.75rem 2rem;border-radius:8px;background:var(--accent);color:white;text-decoration:none;font-weight:600;">\u2B07\uFE0F Download ' + escapeHtml(dlFn) + '</a></p>';
            lastResult.downloadUrl = data.download;
          } else if ((fmt === 'txt' || summarize) && fmt !== 'json' && fmt !== 'vtt' && fmt !== 'srt') {
            result.className = 'md';
            result.innerHTML = renderMarkdown(data.text);
          } else {
            result.className = 'plain';
            result.textContent = data.text;
          }
          if (requestedLang) {
            document.getElementById('lang-badge-text').textContent = requestedLang;
            document.getElementById('lang-badge').style.display = 'block';
          }
          showStats(data.text || '');
          notifyDone(data.title, url);
        } else if (data.type === 'error') {
          setStatus(data.message, 'error');
        } else {
          addLog(data.message, data.type);
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      setStatus('Cancelled.', 'error');
    } else {
      setStatus('Request failed: ' + e.message, 'error');
    }
  }
  currentController = null;
  clearHint();
  btn.textContent = 'Transcribe';
  btn.className = '';
}
document.getElementById('url').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
async function copyText() {
  const result = document.getElementById('result');
  const text = result.className === 'md' ? result.innerText : result.textContent;
  if (!text) return;
  const btn = document.getElementById('copy-btn');
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied!';
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      btn.textContent = document.execCommand('copy') ? 'Copied!' : 'Copy failed';
      document.body.removeChild(ta);
    } catch (e2) {
      btn.textContent = 'Copy failed';
    }
  }
  setTimeout(() => btn.textContent = 'Copy', 1500);
}
function downloadFile() {
  if (!lastResult) return;
  if (lastResult.downloadUrl) {
    const a = document.createElement('a');
    a.href = lastResult.downloadUrl;
    const customFn = document.getElementById('filename').value.trim();
    a.download = customFn || lastResult.filename;
    a.click();
    return;
  }
  const ext = lastResult.filename.split('.').pop();
  const mime = ext === 'json' ? 'application/json' : ext === 'vtt' ? 'text/vtt' : 'text/plain';
  const blob = new Blob([lastResult.text], { type: mime + ';charset=utf-8' });
  const objectUrl = URL.createObjectURL(blob);
  const customFn = document.getElementById('filename').value.trim();
  const finalFn = customFn || lastResult.filename;
  const a = document.createElement('a');
  a.href = objectUrl;
  a.download = finalFn;
  a.click();
  setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
}
</script>
