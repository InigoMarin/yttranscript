[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yttranscript"
version = "2.0.0"
description = "Download YouTube video transcripts (subtitles/captions) with Whisper fallback."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ima" }]
keywords = ["youtube", "transcript", "subtitles", "whisper", "yt-dlp", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp",
]

[project.optional-dependencies]
whisper = ["openai-whisper"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pyflakes>=3",
    "build",
]

[project.scripts]
yttranscript = "yttranscript:main"

[project.urls]
Homepage = "https://github.com/InigoMarin/yttranscript"

[tool.setuptools.packages.find]
include = ["yttranscript*"]

[tool.setuptools.package-data]
yttranscript = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::UserWarning",
]
